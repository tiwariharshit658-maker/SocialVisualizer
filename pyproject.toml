[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialvisualizer"
version = "1.0.0"
description = "Collect and visualize social post text with local data and public Bluesky search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.7",
  "wordcloud>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
socialvisualizer = "socialvisualizer.cli:main"

[tool.setuptools.packages.find]
include = ["socialvisualizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
